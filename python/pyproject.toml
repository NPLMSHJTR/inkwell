[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "inkwell"
version = "0.1.0"
description = "A positional search engine with BM25 ranking and phrase queries, verified end to end against an independent Python index."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "inkwell contributors" }]
keywords = ["search-engine", "bm25", "inverted-index", "phrase-search", "information-retrieval"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Java",
  "Programming Language :: Python :: 3",
  "Programming Language :: TypeScript",
  "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.scripts]
inkwell = "inkwell.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/inkwell"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
